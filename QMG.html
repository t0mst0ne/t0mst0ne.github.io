// ── Helpers ────────────────────────────────────────────────────────────────
function scoreFromTime(val, thresholds) {
    // thresholds = [t_mild, t_mod, t_sev] — values *above* each = lower grade
    if (val >= thresholds[0]) return 0;
    if (val >= thresholds[1]) return 1;
    if (val >= thresholds[2]) return 2;
    return 3;
}
function scoreFromFvc(val) {
    if (val > 80)  return 0;
    if (val >= 65) return 1;
    if (val >= 50) return 2;
    return 3;
}
function scoreFromGrip(val, sex, item) {
    const thr = sex === "M" ? item.thresholds_m : item.thresholds_f;
    if (val > thr[0]) return 0;
    if (val >= thr[1]) return 1;
    if (val >= thr[2]) return 2;
    return 3;
}

function getOptions(item, sex) {
    if (item.type === "grip") return sex === "M" ? item.options_m : item.options_f;
    return item.options;
}

// ── CopyBtn ────────────────────────────────────────────────────────────────
function CopyBtn({ text, label = "複製", className = "" }) {
    const [copied, setCopied] = useState(false);
    const copy = () => {
        navigator.clipboard.writeText(String(text)).then(() => {
            setCopied(true);
            setTimeout(() => setCopied(false), 1600);
        });
    };
    return (
        <button onClick={copy}
            className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-medium border transition-all
                ${copied
                    ? "bg-green-100 text-green-700 border-green-300"
                    : "bg-white text-slate-500 border-slate-200 hover:border-slate-400 hover:text-slate-700"
                } ${className}`}>
            {copied
                ? <><CheckIcon className="w-3 h-3"/>已複製</>
                : <><CopyIcon className="w-3 h-3"/>{label}</>}
        </button>
    );
}

// ── ScoreChip ──────────────────────────────────────────────────────────────
function ScoreChip({ score }) {
    const colors = [
        "bg-green-100 text-green-800 border-green-300",
        "bg-blue-100 text-blue-800 border-blue-300",
        "bg-amber-100 text-amber-800 border-amber-300",
        "bg-red-100 text-red-800 border-red-300",
    ];
    const c = score === null ? "bg-slate-100 text-slate-400 border-slate-200" : colors[score];
    return (
        <span className={`inline-flex items-center justify-center w-7 h-7 rounded-full border text-sm font-bold ${c}`}>
            {score === null ? "–" : score}
        </span>
    );
}

// ── Raw input → auto-grade ─────────────────────────────────────────────────
function RawInput({ item, sex, onAutoScore }) {
    const [raw, setRaw] = useState("");

    const handleChange = (e) => {
        const v = e.target.value;
        setRaw(v);
        const num = parseFloat(v);
        if (isNaN(num) || v === "") return;

        let grade = null;
        if (item.type === "timed" || item.type === "timed_ocular") {
            grade = scoreFromTime(num, item.thresholds || [61, 11, 1]);
        } else if (item.type === "fvc") {
            grade = scoreFromFvc(num);
        } else if (item.type === "grip") {
            grade = scoreFromGrip(num, sex, item);
        }
        if (grade !== null) onAutoScore(grade);
    };

    return (
        <div className="flex items-center gap-2 px-5 py-2 bg-slate-50 border-b border-slate-100">
            <span className="text-xs text-slate-500">實測值</span>
            <input
                type="number" min="0" value={raw}
                onChange={handleChange}
                placeholder="輸入數值自動換算"
                className="w-36 text-sm border border-slate-300 rounded-md px-2 py-1 focus:outline-none focus:ring-2 focus:ring-indigo-300"
            />
            <span className="text-xs text-slate-400">{item.rawUnit}</span>
            {raw && <button onClick={() => { setRaw(""); }} className="text-xs text-slate-400 hover:text-slate-600">清除</button>}
        </div>
    );
}

// ── QuestionCard ───────────────────────────────────────────────────────────
function QuestionCard({ item, sex, value, onChange }) {
    const grp = GROUPS.find(g => g.id === item.group);
    const options = getOptions(item, sex);
    const hasRaw = ["timed", "timed_ocular", "fvc", "grip"].includes(item.type);

    // For timed_ocular: option 3 is "spontaneous" — can't enter numerically
    // Raw input only handles 0-2 for ocular items
    const handleAutoScore = (grade) => onChange(item.id, grade);

    return (
        <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden fade-in">
            {/* Header */}
            <div className="flex items-center justify-between px-5 py-3 bg-slate-50 border-b border-slate-200">
                <div className="flex items-center gap-3 min-w-0">
                    <span className={`flex items-center justify-center w-7 h-7 rounded-full ${grp.color} text-white text-xs font-bold shrink-0`}>
                        {item.index}
                    </span>
                    <div className="min-w-0">
                        <div className="flex items-center gap-2 flex-wrap">
                            <span className="font-semibold text-slate-800 text-sm">{item.zh}</span>
                            <span className={`text-xs px-1.5 py-0.5 rounded ${grp.color} text-white opacity-80`}>{grp.zh}</span>
                        </div>
                        <p className="text-xs text-slate-400 truncate">{item.en}</p>
                    </div>
                </div>
                <div className="flex items-center gap-2 shrink-0 ml-2">
                    <ScoreChip score={value} />
                    {value !== null && <CopyBtn text={value} />}
                </div>
            </div>

            {/* Instruction */}
            {item.instruction_zh && (
                <div className="px-5 py-1.5 bg-indigo-50 border-b border-indigo-100 text-xs text-indigo-700">
                    📋 {item.instruction_zh}
                    <span className="text-indigo-400 ml-1">— {item.instruction_en}</span>
                </div>
            )}

            {/* Raw input for numeric items */}
            {hasRaw && <RawInput item={item} sex={sex} onAutoScore={handleAutoScore} />}

            {/* Options */}
            <div className="divide-y divide-slate-100">
                {options.map((opt) => {
                    const selected = value === opt.score;
                    return (
                        <label key={opt.score}
                            className={`flex items-start gap-4 px-5 py-2.5 cursor-pointer transition-colors
                                ${selected ? "bg-indigo-50" : "hover:bg-slate-50"}`}>
                            <div className="flex items-center gap-2 shrink-0 mt-0.5">
                                <input
                                    type="radio"
                                    name={item.id}
                                    value={opt.score}
                                    checked={selected}
                                    onChange={() => onChange(item.id, opt.score)}
                                    className="w-4 h-4 accent-indigo-600"
                                />
                                <span className={`text-sm font-bold w-4 text-center
                                    ${selected ? "text-indigo-600" : "text-slate-400"}`}>
                                    {opt.score}
                                </span>
                            </div>
                            <div className="flex-1 min-w-0">
                                <span className={`text-sm font-medium ${selected ? "text-indigo-800" : "text-slate-700"}`}>
                                    {opt.zh}
                                </span>
                                <span className="text-xs text-slate-400 ml-2">{opt.en}</span>
                            </div>
                        </label>
                    );
                })}
            </div>
        </div>
    );
}

// ── ResultPanel ────────────────────────────────────────────────────────────
function ResultPanel({ scores }) {
    const answered = ITEMS.filter(i => scores[i.id] !== null);
    const allDone  = answered.length === ITEMS.length;
    const total    = allDone ? ITEMS.reduce((s, i) => s + scores[i.id], 0) : null;

    const buildText = useCallback(() => {
        const today = new Date().toLocaleDateString("zh-TW", { year: "numeric", month: "2-digit", day: "2-digit" });
        const lines = [`QMG 評估結果　${today}`, "─".repeat(40)];
        ITEMS.forEach((item) => {
            const v = scores[item.id];
            lines.push(`${item.index.toString().padStart(2)}. ${item.zh}：${v !== null ? v : "–"}`);
        });
        lines.push("─".repeat(40));
        lines.push(total !== null
            ? `Total QMG Score：${total} / 39`
            : `Total QMG Score：尚未全部作答（${answered.length}/13）`);
        return lines.join("\n");
    }, [scores, total, answered.length]);

    const [copiedAll, setCopiedAll] = useState(false);
    const copyAll = () => {
        navigator.clipboard.writeText(buildText()).then(() => {
            setCopiedAll(true);
            setTimeout(() => setCopiedAll(false), 2000);
        });
    };

    // Progress bar color
    const pct = total !== null ? Math.round((total / 39) * 100) : null;
    const barColor = pct === null ? "bg-slate-300"
        : pct < 33 ? "bg-emerald-500"
        : pct < 67 ? "bg-amber-500"
        : "bg-red-500";

    return (
        <div className="rounded-xl border-2 border-slate-200 bg-slate-50 p-5 shadow-sm">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
                <div>
                    <div className="text-xs uppercase tracking-widest text-slate-500 mb-1">Total QMG Score</div>
                    <div className="flex items-baseline gap-3">
                        <span className={`text-5xl font-extrabold ${total !== null ? "text-slate-800" : "text-slate-300"}`}>
                            {total !== null ? total : "–"}
                        </span>
                        <span className="text-slate-400 text-lg">/ 39</span>
                    </div>
                    {total !== null && (
                        <div className="mt-2 w-48">
                            <div className="h-2 bg-slate-200 rounded-full overflow-hidden">
                                <div className={`h-2 rounded-full transition-all ${barColor}`}
                                    style={{ width: `${pct}%` }}/>
                            </div>
                            <div className="text-xs text-slate-400 mt-0.5">
                                MCID ≥ 3.5 分（治療反應參考）
                            </div>
                        </div>
                    )}
                    {!allDone && (
                        <div className="text-xs text-slate-400 mt-1">
                            已完成 {answered.length} / {ITEMS.length} 題
                        </div>
                    )}
                </div>

                <button onClick={copyAll}
                    className={`no-print inline-flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium border transition-all
                        ${copiedAll
                            ? "bg-green-100 text-green-700 border-green-300"
                            : "bg-white text-slate-600 border-slate-300 hover:border-indigo-400 hover:text-indigo-700"
                        }`}>
                    {copiedAll
                        ? <><CheckIcon className="w-4 h-4"/>複製完成</>
                        : <><CopyIcon className="w-4 h-4"/>複製完整結果</>}
                </button>
            </div>

            {/* Summary table */}
            <div className="bg-white/70 rounded-lg overflow-hidden border border-slate-200">
                <div className="grid grid-cols-[auto_1fr_auto_auto] text-xs font-semibold text-slate-500 uppercase tracking-wide px-4 py-2 border-b border-slate-200 bg-slate-50">
                    <span className="w-6">#</span>
                    <span>項目</span>
                    <span className="w-12 text-center">分數</span>
                    <span className="w-14 text-center no-print">複製</span>
                </div>
                {ITEMS.map((item, i) => {
                    const v = scores[item.id];
                    const grp = GROUPS.find(g => g.id === item.group);
                    return (
                        <div key={item.id}
                            className={`grid grid-cols-[auto_1fr_auto_auto] items-center px-4 py-2 text-sm
                                ${i % 2 === 0 ? "" : "bg-slate-50/60"}
                                border-b border-slate-100 last:border-0`}>
                            <span className="w-6 text-slate-400 text-xs">{item.index}</span>
                            <div className="flex items-center gap-1.5 truncate pr-2">
                                <span className={`w-1.5 h-1.5 rounded-full shrink-0 ${grp.color}`}/>
                                <span className="text-slate-700 truncate">{item.zh}</span>
                            </div>
                            <span className="w-12 flex justify-center">
                                <ScoreChip score={v} />
                            </span>
                            <span className="w-14 flex justify-center no-print">
                                {v !== null && <CopyBtn text={v} />}
                            </span>
                        </div>
                    );
                })}
            </div>
        </div>
    );
}

// ── GroupHeader ────────────────────────────────────────────────────────────
function GroupHeader({ group }) {
    return (
        <div className="flex items-center gap-3 mt-6 mb-2 fade-in">
            <div className={`w-2.5 h-2.5 rounded-full ${group.color}`}/>
            <span className="text-xs font-bold text-slate-600 uppercase tracking-widest">{group.zh}</span>
            <span className="text-xs text-slate-400">{group.en}</span>
            <div className="flex-1 border-t border-slate-200"/>
        </div>
    );
}

// ── App ────────────────────────────────────────────────────────────────────
function App() {
    const initScores = () => Object.fromEntries(ITEMS.map(i => [i.id, null]));
    const [scores, setScores] = useState(initScores);
    const [sex, setSex] = useState("M"); // "M" | "F"

    const handleChange = (id, value) => setScores(prev => ({ ...prev, [id]: value }));

    const reset = () => {
        if (window.confirm("確定要清除所有作答內容？")) {
            setScores(initScores());
            window.scrollTo({ top: 0, behavior: "smooth" });
        }
    };

    // Group items
    const groupedItems = GROUPS.map(g => ({
        group: g,
        items: ITEMS.filter(i => i.group === g.id),
    })).filter(g => g.items.length > 0);

    return (
        <div className="max-w-2xl mx-auto px-4 py-8">
            {/* Header */}
            <div className="mb-6 fade-in">
                <div className="inline-block bg-indigo-100 text-indigo-700 text-xs font-semibold px-3 py-1 rounded-full mb-3 uppercase tracking-wide">
                    Neurology · MG Assessment
                </div>
                <h1 className="text-2xl font-extrabold text-slate-900 leading-tight">QMG Score</h1>
                <p className="text-slate-500 text-sm mt-1">
                    Quantitative Myasthenia Gravis Score
                    &nbsp;·&nbsp; 重症肌無力量化評估（醫師執行）
                </p>
                <p className="text-xs text-slate-400 mt-2">
                    共 13 項，每項 0–3 分，總分 0–39 分。分數越高，障礙越嚴重。治療反應 MCID ≥ 3.5 分。
                </p>
            </div>

            {/* Sex toggle — affects hand grip cutoffs */}
            <div className="mb-4 fade-in">
                <div className="inline-flex items-center gap-3 bg-white border border-slate-200 rounded-xl px-4 py-2.5 shadow-sm">
                    <span className="text-sm font-medium text-slate-600">病患性別</span>
                    <span className="text-xs text-slate-400">（影響握力評分標準）</span>
                    <div className="flex rounded-lg overflow-hidden border border-slate-200">
                        <button
                            onClick={() => setSex("M")}
                            className={`px-4 py-1.5 text-sm font-semibold transition-colors
                                ${sex === "M" ? "bg-indigo-600 text-white" : "bg-white text-slate-600 hover:bg-slate-50"}`}>
                            男 Male
                        </button>
                        <button
                            onClick={() => setSex("F")}
                            className={`px-4 py-1.5 text-sm font-semibold transition-colors
                                ${sex === "F" ? "bg-pink-500 text-white" : "bg-white text-slate-600 hover:bg-slate-50"}`}>
                            女 Female
                        </button>
                    </div>
                </div>
            </div>

            {/* Questions by group */}
            <div className="mb-8">
                {groupedItems.map(({ group, items }) => (
                    <div key={group.id}>
                        <GroupHeader group={group} />
                        <div className="space-y-3">
                            {items.map(item => (
                                <QuestionCard
                                    key={item.id}
                                    item={item}
                                    sex={sex}
                                    value={scores[item.id]}
                                    onChange={handleChange}
                                />
                            ))}
                        </div>
                    </div>
                ))}
            </div>

            {/* Result */}
            <div className="mb-6 fade-in">
                <h2 className="text-sm font-semibold text-slate-600 uppercase tracking-widest mb-3">
                    計算結果
                </h2>
                <ResultPanel scores={scores} />
            </div>

            {/* Actions */}
            <div className="flex gap-3 justify-end no-print">
                <button onClick={reset}
                    className="inline-flex items-center gap-2 px-4 py-2 rounded-lg border border-slate-300 text-slate-600 text-sm font-medium hover:border-red-300 hover:text-red-600 transition-colors bg-white">
                    <RefreshIcon className="w-4 h-4"/> 重置
                </button>
                <button onClick={() => window.print()}
                    className="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium transition-colors shadow-sm">
                    <PrinterIcon className="w-4 h-4"/> 列印
                </button>
            </div>

            {/* Footer */}
            <p className="text-center text-xs text-slate-400 mt-8 no-print">
                來源：<a href="https://www.tnms.com.tw/en/qmg-2/" target="_blank" rel="noopener noreferrer"
                    className="underline hover:text-indigo-500">台灣神經免疫醫學會 TNMS</a>
                &nbsp;·&nbsp; Barohn RJ, et al. <em>Ann NY Acad Sci</em> 1998;841:769–772.
            </p>
        </div>
    );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
