<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MG-ADL 重症肌無力日常生活活動評估</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            body { background-color: white; }
            .shadow-lg { box-shadow: none !important; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes pulse-once {
            0%   { background-color: inherit; }
            30%  { background-color: #bbf7d0; }
            100% { background-color: inherit; }
        }
        .copy-flash { animation: pulse-once 0.7s ease-out; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
<div id="root"></div>

<script type="text/babel">
const { useState, useRef, useCallback } = React;

// ── Icons ──────────────────────────────────────────────────────────────────
const CopyIcon = (p) => (
    <svg {...p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
    </svg>
);
const CheckIcon = (p) => (
    <svg {...p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="20 6 9 17 4 12"/>
    </svg>
);
const PrinterIcon = (p) => (
    <svg {...p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="6 9 6 2 18 2 18 9"/>
        <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
        <rect x="6" y="14" width="12" height="8"/>
    </svg>
);
const RefreshIcon = (p) => (
    <svg {...p} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
        <path d="M21 3v5h-5"/>
        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
        <path d="M8 16H3v5"/>
    </svg>
);

// ── MG-ADL data ────────────────────────────────────────────────────────────
const ITEMS = [
    {
        id: "talking",
        en: "Talking",
        zh: "說話",
        options: [
            { score: 0, en: "Normal", zh: "正常" },
            { score: 1, en: "Intermittent slurring or nasal speech", zh: "間歇性口齒不清或鼻音" },
            { score: 2, en: "Constant slurring or nasal, but can be understood", zh: "持續性口齒不清或鼻音，但可被理解" },
            { score: 3, en: "Difficult to understand speech", zh: "說話難以理解" },
        ],
    },
    {
        id: "chewing",
        en: "Chewing",
        zh: "咀嚼",
        options: [
            { score: 0, en: "Normal", zh: "正常" },
            { score: 1, en: "Fatigue with solid food", zh: "進食固體食物時出現疲勞" },
            { score: 2, en: "Fatigue with soft food", zh: "進食軟質食物時出現疲勞" },
            { score: 3, en: "Gastric tube", zh: "需使用鼻胃管" },
        ],
    },
    {
        id: "swallowing",
        en: "Swallowing",
        zh: "吞嚥",
        options: [
            { score: 0, en: "Normal", zh: "正常" },
            { score: 1, en: "Rare episode of choking", zh: "偶爾發生嗆咳" },
            { score: 2, en: "Frequent choking necessitating changes in diet", zh: "頻繁嗆咳需改變飲食內容" },
            { score: 3, en: "Gastric tube", zh: "需使用鼻胃管" },
        ],
    },
    {
        id: "breathing",
        en: "Breathing",
        zh: "呼吸",
        options: [
            { score: 0, en: "Normal", zh: "正常" },
            { score: 1, en: "Shortness of breath with exertion", zh: "活動時呼吸困難" },
            { score: 2, en: "Shortness of breath at rest", zh: "休息時呼吸困難" },
            { score: 3, en: "Ventilator dependence", zh: "需依賴呼吸器" },
        ],
    },
    {
        id: "brush_comb",
        en: "Impairment of ability to brush teeth or comb hair",
        zh: "刷牙／梳頭能力",
        options: [
            { score: 0, en: "None", zh: "無受損" },
            { score: 1, en: "Extra effort, but no rest periods needed", zh: "需額外用力，但不需休息" },
            { score: 2, en: "Rest periods needed", zh: "需要中途休息" },
            { score: 3, en: "Cannot do one of these functions", zh: "無法完成其中一項動作" },
        ],
    },
    {
        id: "arise_chair",
        en: "Impairment of ability to arise from chair",
        zh: "從椅子起身能力",
        options: [
            { score: 0, en: "None", zh: "無受損" },
            { score: 1, en: "Mild, sometimes uses arms", zh: "輕度，偶爾需用手臂撐起" },
            { score: 2, en: "Moderate, always uses arms", zh: "中度，總是需用手臂撐起" },
            { score: 3, en: "Severe, requires assistance", zh: "嚴重，需要他人協助" },
        ],
    },
    {
        id: "double_vision",
        en: "Double vision",
        zh: "複視",
        options: [
            { score: 0, en: "None", zh: "無" },
            { score: 1, en: "Occurs, but not daily", zh: "有發生，但非每天" },
            { score: 2, en: "Daily, but not constant", zh: "每天發生，但非持續性" },
            { score: 3, en: "Constant", zh: "持續性複視" },
        ],
    },
    {
        id: "eyelid_droop",
        en: "Eyelid droop",
        zh: "眼瞼下垂",
        options: [
            { score: 0, en: "None", zh: "無" },
            { score: 1, en: "Occurs, but not daily", zh: "有發生，但非每天" },
            { score: 2, en: "Daily, but not constant", zh: "每天發生，但非持續性" },
            { score: 3, en: "Constant", zh: "持續性下垂" },
        ],
    },
];

const getSeverity = (total) => {
    if (total === null) return null;
    if (total === 0)        return { label: "無症狀", color: "text-green-700",  bg: "bg-green-50",  border: "border-green-300" };
    if (total <= 4)         return { label: "輕度",   color: "text-blue-700",   bg: "bg-blue-50",   border: "border-blue-300" };
    if (total <= 10)        return { label: "中度",   color: "text-amber-700",  bg: "bg-amber-50",  border: "border-amber-300" };
    return                         { label: "重度",   color: "text-red-700",    bg: "bg-red-50",    border: "border-red-300" };
};

// ── CopyBtn ────────────────────────────────────────────────────────────────
function CopyBtn({ text, className = "" }) {
    const [copied, setCopied] = useState(false);
    const copy = () => {
        navigator.clipboard.writeText(String(text)).then(() => {
            setCopied(true);
            setTimeout(() => setCopied(false), 1500);
        });
    };
    return (
        <button onClick={copy}
            title="複製"
            className={`inline-flex items-center gap-1 px-2 py-1 rounded text-xs font-medium transition-all
                ${copied
                    ? "bg-green-100 text-green-700 border border-green-300"
                    : "bg-white text-slate-500 border border-slate-200 hover:border-slate-400 hover:text-slate-700"
                } ${className}`}>
            {copied
                ? <><CheckIcon className="w-3 h-3" /> 已複製</>
                : <><CopyIcon className="w-3 h-3" /> 複製</>}
        </button>
    );
}

// ── ScoreChip ──────────────────────────────────────────────────────────────
function ScoreChip({ score }) {
    const colors = [
        "bg-green-100 text-green-800 border-green-300",
        "bg-blue-100 text-blue-800 border-blue-300",
        "bg-amber-100 text-amber-800 border-amber-300",
        "bg-red-100 text-red-800 border-red-300",
    ];
    const c = score === null ? "bg-slate-100 text-slate-400 border-slate-200" : colors[score];
    return (
        <span className={`inline-flex items-center justify-center w-7 h-7 rounded-full border text-sm font-bold ${c}`}>
            {score === null ? "–" : score}
        </span>
    );
}

// ── QuestionCard ───────────────────────────────────────────────────────────
function QuestionCard({ item, index, value, onChange }) {
    return (
        <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden fade-in">
            {/* Header */}
            <div className="flex items-center justify-between px-5 py-3 bg-slate-50 border-b border-slate-200">
                <div className="flex items-center gap-3">
                    <span className="flex items-center justify-center w-7 h-7 rounded-full bg-indigo-100 text-indigo-700 text-sm font-bold shrink-0">
                        {index + 1}
                    </span>
                    <div>
                        <span className="font-semibold text-slate-800">{item.zh}</span>
                        <span className="ml-2 text-xs text-slate-400">{item.en}</span>
                    </div>
                </div>
                <div className="flex items-center gap-2">
                    <ScoreChip score={value} />
                    {value !== null && (
                        <CopyBtn text={value} />
                    )}
                </div>
            </div>

            {/* Options */}
            <div className="divide-y divide-slate-100">
                {item.options.map((opt) => {
                    const selected = value === opt.score;
                    return (
                        <label key={opt.score}
                            className={`flex items-start gap-4 px-5 py-3 cursor-pointer transition-colors
                                ${selected ? "bg-indigo-50" : "hover:bg-slate-50"}`}>
                            <div className="flex items-center gap-2 shrink-0 mt-0.5">
                                <input
                                    type="radio"
                                    name={item.id}
                                    value={opt.score}
                                    checked={selected}
                                    onChange={() => onChange(item.id, opt.score)}
                                    className="w-4 h-4 accent-indigo-600"
                                />
                                <span className={`text-sm font-bold w-4 text-center
                                    ${selected ? "text-indigo-600" : "text-slate-400"}`}>
                                    {opt.score}
                                </span>
                            </div>
                            <div className="flex-1 min-w-0">
                                <div className={`text-sm font-medium ${selected ? "text-indigo-800" : "text-slate-700"}`}>
                                    {opt.zh}
                                </div>
                                <div className="text-xs text-slate-400 mt-0.5">{opt.en}</div>
                            </div>
                        </label>
                    );
                })}
            </div>
        </div>
    );
}

// ── ResultPanel ────────────────────────────────────────────────────────────
function ResultPanel({ scores }) {
    const answered = ITEMS.filter(i => scores[i.id] !== null);
    const allDone  = answered.length === ITEMS.length;
    const total    = allDone ? ITEMS.reduce((s, i) => s + scores[i.id], 0) : null;
    const sev      = getSeverity(total);

    const buildText = useCallback(() => {
        const today = new Date().toLocaleDateString("zh-TW", { year: "numeric", month: "2-digit", day: "2-digit" });
        const lines = [
            `MG-ADL 評估結果　${today}`,
            "─".repeat(36),
        ];
        ITEMS.forEach((item, i) => {
            const v = scores[item.id];
            const label = v !== null ? item.options[v].zh : "未填寫";
            lines.push(`${i + 1}. ${item.zh}：${v !== null ? v : "–"}  (${label})`);
        });
        lines.push("─".repeat(36));
        if (total !== null) {
            lines.push(`Total Score：${total} / 24　[${sev.label}]`);
        } else {
            lines.push(`Total Score：尚未全部作答（${answered.length}/8）`);
        }
        return lines.join("\n");
    }, [scores, total, sev, answered.length]);

    const [copiedAll, setCopiedAll] = useState(false);
    const copyAll = () => {
        navigator.clipboard.writeText(buildText()).then(() => {
            setCopiedAll(true);
            setTimeout(() => setCopiedAll(false), 2000);
        });
    };

    return (
        <div className={`rounded-xl border-2 ${sev ? sev.border : "border-slate-200"} ${sev ? sev.bg : "bg-slate-50"} p-5 shadow-sm`}>
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
                <div>
                    <div className="text-xs uppercase tracking-widest text-slate-500 mb-1">Total Score</div>
                    <div className="flex items-baseline gap-3">
                        <span className={`text-5xl font-extrabold ${sev ? sev.color : "text-slate-300"}`}>
                            {total !== null ? total : "–"}
                        </span>
                        <span className="text-slate-400 text-lg">/ 24</span>
                        {sev && (
                            <span className={`text-lg font-semibold ${sev.color}`}>{sev.label}</span>
                        )}
                    </div>
                    {!allDone && (
                        <div className="text-xs text-slate-400 mt-1">
                            已完成 {answered.length} / {ITEMS.length} 題
                        </div>
                    )}
                </div>

                <button onClick={copyAll}
                    className={`no-print inline-flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium border transition-all
                        ${copiedAll
                            ? "bg-green-100 text-green-700 border-green-300"
                            : "bg-white text-slate-600 border-slate-300 hover:border-indigo-400 hover:text-indigo-700"
                        }`}>
                    {copiedAll
                        ? <><CheckIcon className="w-4 h-4"/>複製完成</>
                        : <><CopyIcon className="w-4 h-4"/>複製完整結果</>}
                </button>
            </div>

            {/* Per-item summary table */}
            <div className="bg-white/70 rounded-lg overflow-hidden border border-slate-200">
                <div className="grid grid-cols-[auto_1fr_auto_auto] text-xs font-semibold text-slate-500 uppercase tracking-wide px-4 py-2 border-b border-slate-200 bg-slate-50">
                    <span className="w-6">#</span>
                    <span>項目</span>
                    <span className="w-12 text-center">分數</span>
                    <span className="w-14 text-center no-print">複製</span>
                </div>
                {ITEMS.map((item, i) => {
                    const v = scores[item.id];
                    return (
                        <div key={item.id}
                            className={`grid grid-cols-[auto_1fr_auto_auto] items-center px-4 py-2 text-sm
                                ${i % 2 === 0 ? "" : "bg-slate-50/60"}
                                border-b border-slate-100 last:border-0`}>
                            <span className="w-6 text-slate-400 text-xs">{i + 1}</span>
                            <span className="text-slate-700 truncate pr-2">{item.zh}</span>
                            <span className="w-12 flex justify-center">
                                <ScoreChip score={v} />
                            </span>
                            <span className="w-14 flex justify-center no-print">
                                {v !== null && <CopyBtn text={v} />}
                            </span>
                        </div>
                    );
                })}
            </div>

            {/* Severity reference */}
            <div className="mt-4 grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs text-center">
                {[
                    { range: "0", label: "無症狀", c: "bg-green-50 border-green-200 text-green-700" },
                    { range: "1–4", label: "輕度", c: "bg-blue-50 border-blue-200 text-blue-700" },
                    { range: "5–10", label: "中度", c: "bg-amber-50 border-amber-200 text-amber-700" },
                    { range: "≥11", label: "重度", c: "bg-red-50 border-red-200 text-red-700" },
                ].map(s => (
                    <div key={s.label} className={`rounded border px-2 py-1.5 font-medium ${s.c}`}>
                        <div className="text-base font-bold">{s.range}</div>
                        <div>{s.label}</div>
                    </div>
                ))}
            </div>
        </div>
    );
}

// ── App ────────────────────────────────────────────────────────────────────
function App() {
    const initScores = () => Object.fromEntries(ITEMS.map(i => [i.id, null]));
    const [scores, setScores] = useState(initScores);

    const handleChange = (id, value) => {
        setScores(prev => ({ ...prev, [id]: value }));
    };

    const reset = () => {
        if (window.confirm("確定要清除所有作答內容？")) {
            setScores(initScores());
            window.scrollTo({ top: 0, behavior: "smooth" });
        }
    };

    return (
        <div className="max-w-2xl mx-auto px-4 py-8">
            {/* Header */}
            <div className="mb-6 fade-in">
                <div className="inline-block bg-indigo-100 text-indigo-700 text-xs font-semibold px-3 py-1 rounded-full mb-3 uppercase tracking-wide">
                    Neurology · MG Assessment
                </div>
                <h1 className="text-2xl font-extrabold text-slate-900 leading-tight">
                    MG-ADL Score
                </h1>
                <p className="text-slate-500 text-sm mt-1">
                    Myasthenia Gravis Activities of Daily Living
                    &nbsp;·&nbsp; 重症肌無力日常生活活動評估
                </p>
                <p className="text-xs text-slate-400 mt-2">
                    共 8 項，每項 0–3 分，總分 0–24 分。分數越高，功能障礙越嚴重。
                </p>
            </div>

            {/* Questions */}
            <div className="space-y-4 mb-8">
                {ITEMS.map((item, i) => (
                    <QuestionCard
                        key={item.id}
                        item={item}
                        index={i}
                        value={scores[item.id]}
                        onChange={handleChange}
                    />
                ))}
            </div>

            {/* Result */}
            <div className="mb-6 fade-in">
                <h2 className="text-sm font-semibold text-slate-600 uppercase tracking-widest mb-3">
                    計算結果
                </h2>
                <ResultPanel scores={scores} />
            </div>

            {/* Action buttons */}
            <div className="flex gap-3 justify-end no-print">
                <button onClick={reset}
                    className="inline-flex items-center gap-2 px-4 py-2 rounded-lg border border-slate-300 text-slate-600 text-sm font-medium hover:border-red-300 hover:text-red-600 transition-colors bg-white">
                    <RefreshIcon className="w-4 h-4" /> 重置
                </button>
                <button onClick={() => window.print()}
                    className="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium transition-colors shadow-sm">
                    <PrinterIcon className="w-4 h-4" /> 列印
                </button>
            </div>

            {/* Footer */}
            <p className="text-center text-xs text-slate-400 mt-8 no-print">
                來源：<a href="https://www.tnms.com.tw/mg-adl-score/" target="_blank" rel="noopener noreferrer"
                    className="underline hover:text-indigo-500">台灣神經免疫醫學會 TNMS</a>
                &nbsp;·&nbsp; Wolfe GI, et al. <em>Neurology</em> 1999;52:1487–1489.
            </p>
        </div>
    );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
