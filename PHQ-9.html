<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHQ-9 & GAD-7 自我評估量表</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @media print {
            .no-print {
                display: none !important;
            }
            body {
                background-color: white;
            }
            .shadow-lg {
                box-shadow: none !important;
            }
        }
        
        /* Custom Fade In Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
    </style>
</head>
<body class="bg-gray-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef } = React;

        // --- Icon Components (Replacing lucide-react imports) ---
        const AlertCircle = (props) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
        );
        const CheckCircle = (props) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        );
        const Info = (props) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="16" y2="12"/><line x1="12" x2="12.01" y1="8" y2="8"/></svg>
        );
        const RefreshCw = (props) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
        );
        const Printer = (props) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        );
        const BookOpen = (props) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        );
        const HeartPulse = (props) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M12 5 9.04 11l6.96 4"/></svg>
        );

        // --- Data & Constants ---
        const PHQ9_QUESTIONS = [
            "做事時提不起勁或沒有樂趣",
            "感到心情低落、沮喪或絕望",
            "入睡困難、睡不安穩或睡眠過多",
            "覺得疲累或沒有活力",
            "食慾不振或吃太多",
            "覺得自己很糟 ─ 或覺得自己失敗、讓自己或家人失望",
            "對事物專注有困難，例如閱讀報紙或看電視時",
            "動作或說話速度緩慢到別人已經察覺？或正好相反 ─ 煩躁或坐立不安、動來動去",
            "有不如死掉或用某種方式傷害自己的念頭"
        ];

        const GAD7_QUESTIONS = [
            "感到緊張、焦慮或煩躁",
            "不能停止或無法控制擔憂",
            "對各種事情擔憂過多",
            "很難放鬆",
            "坐立難安，以致於無法安靜坐著",
            "容易心煩或易怒",
            "感到害怕，好像即將有可怕的事情發生"
        ];

        const OPTIONS = [
            { value: 0, label: "完全沒有", desc: "Not at all" },
            { value: 1, label: "幾天", desc: "Several days" },
            { value: 2, label: "一半以上的天數", desc: "More than half the days" },
            { value: 3, label: "幾乎每天", desc: "Nearly every day" }
        ];

        // --- Main Application ---
        function App() {
            const [phq9Scores, setPhq9Scores] = useState(Array(9).fill(null));
            const [gad7Scores, setGad7Scores] = useState(Array(7).fill(null));
            const [showResults, setShowResults] = useState(false);
            const resultRef = useRef(null);

            const handlePhq9Change = (index, value) => {
                const newScores = [...phq9Scores];
                newScores[index] = value;
                setPhq9Scores(newScores);
            };

            const handleGad7Change = (index, value) => {
                const newScores = [...gad7Scores];
                newScores[index] = value;
                setGad7Scores(newScores);
            };

            const calculateTotal = (scores) => {
                return scores.reduce((acc, curr) => acc + (curr || 0), 0);
            };

            const isComplete = () => {
                return !phq9Scores.includes(null) && !gad7Scores.includes(null);
            };

            const getPhq9Severity = (score) => {
                if (score <= 4) return { level: "無憂鬱傾向 (None-minimal)", color: "text-green-600", bg: "bg-green-100" };
                if (score <= 9) return { level: "輕度憂鬱 (Mild)", color: "text-yellow-600", bg: "bg-yellow-100" };
                if (score <= 14) return { level: "中度憂鬱 (Moderate)", color: "text-orange-600", bg: "bg-orange-100" };
                if (score <= 19) return { level: "中重度憂鬱 (Moderately Severe)", color: "text-red-600", bg: "bg-red-100" };
                return { level: "重度憂鬱 (Severe)", color: "text-red-800", bg: "bg-red-200" };
            };

            const getGad7Severity = (score) => {
                if (score <= 4) return { level: "無焦慮傾向 (None-minimal)", color: "text-green-600", bg: "bg-green-100" };
                if (score <= 9) return { level: "輕度焦慮 (Mild)", color: "text-yellow-600", bg: "bg-yellow-100" };
                if (score <= 14) return { level: "中度焦慮 (Moderate)", color: "text-orange-600", bg: "bg-orange-100" };
                return { level: "重度焦慮 (Severe)", color: "text-red-800", bg: "bg-red-200" };
            };

            const resetForm = () => {
                setPhq9Scores(Array(9).fill(null));
                setGad7Scores(Array(7).fill(null));
                setShowResults(false);
                window.scrollTo(0, 0);
            };

            const handlePrint = () => {
                window.print();
            };

            const phq9Total = calculateTotal(phq9Scores);
            const gad7Total = calculateTotal(gad7Scores);
            const phq9Result = getPhq9Severity(phq9Total);
            const gad7Result = getGad7Severity(gad7Total);
            
            // Check if item 9 (suicide ideation) is > 0
            const hasRisk = phq9Scores[8] > 0;

            return (
                <div className="min-h-screen bg-gray-50 py-8 px-4 sm:px-6 lg:px-8 font-sans">
                    <div className="max-w-4xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden">
                        
                        {/* Header */}
                        <div className="bg-slate-800 text-white p-6 sm:p-10 text-center">
                            <h1 className="text-3xl font-bold mb-2">PHQ-9 & GAD-7 自我評估量表</h1>
                            <p className="text-slate-300">憂鬱症與焦慮症篩檢工具 (Traditional Chinese)</p>
                            
                            <div className="mt-6 bg-slate-700/50 p-4 rounded-lg text-sm text-left flex items-start gap-3">
                                <Info className="w-6 h-6 flex-shrink-0 text-blue-400 mt-1" />
                                <p>
                                    <span className="font-bold text-blue-300">免責聲明：</span> 此工具僅供初步篩檢參考，<span className="font-bold text-white">不能</span>取代專業醫療診斷。如果您感到痛苦或有相關症狀，請務必尋求專業精神科醫師或心理師的協助。
                                </p>
                            </div>
                        </div>

                        <div className="p-6 sm:p-10 space-y-12">
                            
                            {/* Instructions */}
                            <div className="text-gray-600 bg-gray-50 p-4 rounded-lg border border-gray-200">
                                <h3 className="font-bold text-gray-800 mb-2">填寫說明：</h3>
                                <p>在過去的<span className="font-bold text-indigo-600">兩個星期</span>中，您有多少時間受到以下問題的困擾？請圈選最合適的答案。</p>
                            </div>

                            {/* PHQ-9 Section */}
                            <section>
                                <div className="flex items-center gap-3 mb-6 border-b pb-4">
                                    <div className="bg-indigo-600 text-white p-2 rounded-lg">
                                        <BookOpen className="w-6 h-6" />
                                    </div>
                                    <div>
                                        <h2 className="text-2xl font-bold text-gray-800">PHQ-9</h2>
                                        <p className="text-gray-500">病人健康問卷 (Patient Health Questionnaire)</p>
                                    </div>
                                </div>

                                <div className="space-y-6">
                                    {PHQ9_QUESTIONS.map((q, idx) => (
                                        <div key={`phq-${idx}`} className={`p-4 rounded-lg transition-colors ${idx % 2 === 0 ? 'bg-white' : 'bg-slate-50'} border border-gray-100 hover:border-indigo-200`}>
                                            <p className="font-medium text-lg text-gray-800 mb-4">
                                                <span className="text-indigo-500 font-bold mr-2">{idx + 1}.</span>
                                                {q}
                                            </p>
                                            <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                                                {OPTIONS.map((opt) => (
                                                    <button
                                                        key={opt.value}
                                                        onClick={() => handlePhq9Change(idx, opt.value)}
                                                        className={`p-3 rounded-lg text-sm transition-all duration-200 border ${
                                                            phq9Scores[idx] === opt.value
                                                                ? 'bg-indigo-600 text-white border-indigo-600 shadow-md transform scale-105'
                                                                : 'bg-white text-gray-600 border-gray-200 hover:border-indigo-300 hover:bg-indigo-50'
                                                        }`}
                                                    >
                                                        <div className="font-bold mb-1">{opt.label}</div>
                                                        <div className={`text-xs ${phq9Scores[idx] === opt.value ? 'text-indigo-100' : 'text-gray-400'}`}>({opt.value} 分)</div>
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </section>

                            {/* GAD-7 Section */}
                            <section>
                                <div className="flex items-center gap-3 mb-6 border-b pb-4 pt-4">
                                    <div className="bg-teal-600 text-white p-2 rounded-lg">
                                        <HeartPulse className="w-6 h-6" />
                                    </div>
                                    <div>
                                        <h2 className="text-2xl font-bold text-gray-800">GAD-7</h2>
                                        <p className="text-gray-500">廣泛性焦慮症量表 (Generalized Anxiety Disorder)</p>
                                    </div>
                                </div>

                                <div className="space-y-6">
                                    {GAD7_QUESTIONS.map((q, idx) => (
                                        <div key={`gad-${idx}`} className={`p-4 rounded-lg transition-colors ${idx % 2 === 0 ? 'bg-white' : 'bg-slate-50'} border border-gray-100 hover:border-teal-200`}>
                                            <p className="font-medium text-lg text-gray-800 mb-4">
                                                <span className="text-teal-500 font-bold mr-2">{idx + 1}.</span>
                                                {q}
                                            </p>
                                            <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                                                {OPTIONS.map((opt) => (
                                                    <button
                                                        key={opt.value}
                                                        onClick={() => handleGad7Change(idx, opt.value)}
                                                        className={`p-3 rounded-lg text-sm transition-all duration-200 border ${
                                                            gad7Scores[idx] === opt.value
                                                                ? 'bg-teal-600 text-white border-teal-600 shadow-md transform scale-105'
                                                                : 'bg-white text-gray-600 border-gray-200 hover:border-teal-300 hover:bg-teal-50'
                                                        }`}
                                                    >
                                                        <div className="font-bold mb-1">{opt.label}</div>
                                                        <div className={`text-xs ${gad7Scores[idx] === opt.value ? 'text-teal-100' : 'text-gray-400'}`}>({opt.value} 分)</div>
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </section>

                            {/* Action Buttons (Hidden when printing) */}
                            <div className="flex flex-col sm:flex-row gap-4 justify-center pt-8 border-t no-print">
                                <button
                                    onClick={() => setShowResults(true)}
                                    disabled={!isComplete()}
                                    className={`flex items-center justify-center gap-2 px-8 py-4 rounded-xl font-bold text-lg shadow-lg transition-all ${
                                        isComplete() 
                                        ? 'bg-slate-800 text-white hover:bg-slate-900 hover:shadow-xl transform hover:-translate-y-1' 
                                        : 'bg-gray-200 text-gray-400 cursor-not-allowed'
                                    }`}
                                >
                                    <CheckCircle className="w-6 h-6" />
                                    查看評估結果
                                </button>
                                <button
                                    onClick={resetForm}
                                    className="flex items-center justify-center gap-2 px-8 py-4 rounded-xl font-bold text-gray-600 bg-gray-100 hover:bg-gray-200 transition-colors"
                                >
                                    <RefreshCw className="w-5 h-5" />
                                    重新填寫
                                </button>
                            </div>
                            
                            {!isComplete() && (
                                <p className="text-center text-red-500 text-sm mt-2 no-print">請完成所有題目以查看結果</p>
                            )}

                            {/* Results Section */}
                            {showResults && (
                                <div ref={resultRef} className="animate-fade-in mt-12 bg-white border-2 border-slate-200 rounded-2xl overflow-hidden scroll-mt-10">
                                    <div className="bg-slate-100 p-4 border-b border-slate-200 flex justify-between items-center">
                                        <h3 className="text-xl font-bold text-slate-800">評估報告</h3>
                                        <button onClick={handlePrint} className="flex items-center gap-2 text-sm text-slate-600 hover:text-slate-900 no-print">
                                            <Printer className="w-4 h-4" /> 列印結果
                                        </button>
                                    </div>
                                    
                                    <div className="p-8 grid md:grid-cols-2 gap-8">
                                        {/* PHQ-9 Result */}
                                        <div className="bg-gray-50 p-6 rounded-xl border border-gray-100">
                                            <h4 className="text-lg font-semibold text-indigo-700 mb-2">PHQ-9 憂鬱程度</h4>
                                            <div className="flex items-end gap-2 mb-4">
                                                <span className="text-5xl font-bold text-slate-800">{phq9Total}</span>
                                                <span className="text-gray-500 mb-2">/ 27 分</span>
                                            </div>
                                            <div className={`inline-block px-4 py-2 rounded-full text-sm font-bold ${phq9Result.color} ${phq9Result.bg}`}>
                                                {phq9Result.level}
                                            </div>
                                            <p className="mt-4 text-sm text-gray-600 leading-relaxed">
                                                PHQ-9 主要用於協助篩檢憂鬱症狀的嚴重程度。若分數較高，建議尋求專業諮詢。
                                            </p>
                                        </div>

                                        {/* GAD-7 Result */}
                                        <div className="bg-gray-50 p-6 rounded-xl border border-gray-100">
                                            <h4 className="text-lg font-semibold text-teal-700 mb-2">GAD-7 焦慮程度</h4>
                                            <div className="flex items-end gap-2 mb-4">
                                                <span className="text-5xl font-bold text-slate-800">{gad7Total}</span>
                                                <span className="text-gray-500 mb-2">/ 21 分</span>
                                            </div>
                                            <div className={`inline-block px-4 py-2 rounded-full text-sm font-bold ${gad7Result.color} ${gad7Result.bg}`}>
                                                {gad7Result.level}
                                            </div>
                                            <p className="mt-4 text-sm text-gray-600 leading-relaxed">
                                                GAD-7 用於篩檢廣泛性焦慮症。分數越高代表焦慮症狀可能對生活造成較大影響。
                                            </p>
                                        </div>
                                    </div>

                                    {/* High Risk Alert */}
                                    {hasRisk && (
                                        <div className="m-8 p-6 bg-red-50 border-l-4 border-red-500 rounded-r-lg">
                                            <div className="flex items-start gap-4">
                                                <AlertCircle className="w-8 h-8 text-red-600 flex-shrink-0" />
                                                <div>
                                                    <h4 className="font-bold text-red-800 text-lg mb-2">請注意</h4>
                                                    <p className="text-red-700 mb-4">
                                                        您在 PHQ-9 第 9 題（自我傷害念頭）的填答顯示您可能需要立即的關注與協助。請不要獨自面對。
                                                    </p>
                                                    <div className="font-semibold text-red-900 grid gap-1">
                                                        <p>📞 衛生福利部安心專線：1925 (依舊愛我)</p>
                                                        <p>📞 生命線協談專線：1995</p>
                                                        <p>📞 張老師專線：1980</p>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    <div className="bg-slate-50 p-6 text-center text-sm text-gray-500 border-t border-slate-200">
                                        本測驗結果僅供參考，不具診斷效力。請諮詢身心科醫師以獲得完整評估。
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
